# Releases the version in Cargo.toml when its tag does not exist yet: builds, tags, publishes the
# GitHub release, then updates the Homebrew tap (HOMEBREW_TAP_DEPLOY_KEY secret) and publishes to
# crates.io (CARGO_REGISTRY_TOKEN secret). A manual run on an existing tag repeats only the tap
# update and the crates.io publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      should_publish: ${{ steps.check.outputs.should_publish }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check version tag
        id: check
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases run from main only, not $GITHUB_REF"
            exit 1
          fi
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - run: cargo test --all-targets
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

  build:
    needs: [check-version, quality]
    if: needs.check-version.outputs.should_release == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: av1converter
            artifact: av1converter-x86_64-unknown-linux-musl
            linux_packages: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: av1converter
            artifact: av1converter-x86_64-apple-darwin
            linux_packages: false
          - os: macos-15
            target: aarch64-apple-darwin
            binary: av1converter
            artifact: av1converter-aarch64-apple-darwin
            linux_packages: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: av1converter.exe
            artifact: av1converter-x86_64-pc-windows-msvc.exe
            linux_packages: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux packaging tools
        if: matrix.linux_packages
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          mkdir -p dist
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          if [ "${{ matrix.linux_packages }}" = true ]; then
            packaging/package-linux.sh "dist/${{ matrix.artifact }}" "$VERSION" dist
            dpkg-deb --info "dist/av1converter_${VERSION}_amd64.deb"
            rpm -qip "dist/av1converter-${VERSION}-1.x86_64.rpm"
          fi
          rm "dist/${{ matrix.artifact }}"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          & "dist/${{ matrix.artifact }}" --version
          Compress-Archive -Path "dist/${{ matrix.artifact }}" -DestinationPath "dist/${{ matrix.artifact }}.zip"
          Remove-Item "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum av1converter* > SHA256SUMS
      - name: Tag release
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          REMOTE=$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | awk 'NR == 1 {print $1}')
          if [ -n "$REMOTE" ]; then
            if [ "$REMOTE" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points at $REMOTE, not $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG already points at $GITHUB_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/av1converter*
            dist/SHA256SUMS

  homebrew:
    needs: [check-version, release]
    if: >-
      always()
      && needs.check-version.outputs.should_publish == 'true'
      && (needs.release.result == 'success'
        || (needs.release.result == 'skipped' && needs.check-version.outputs.should_release == 'false'))
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::The HOMEBREW_TAP_DEPLOY_KEY secret is not set; it holds the private half of a deploy key with write access on framicheli/homebrew-tap"
            exit 1
          fi
          SSH_DIR="$RUNNER_TEMP/tap-ssh"
          (umask 077 && mkdir -p "$SSH_DIR" && printf '%s\n' "$TAP_DEPLOY_KEY" > "$SSH_DIR/key")
          trap 'rm -rf "$SSH_DIR"' EXIT
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$SSH_DIR/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $SSH_DIR/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes"
          VERSION="${TAG#v}"
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
          ARM=$(awk '$2 == "av1converter-aarch64-apple-darwin.tar.gz" {print $1}' dist/SHA256SUMS)
          INTEL=$(awk '$2 == "av1converter-x86_64-apple-darwin.tar.gz" {print $1}' dist/SHA256SUMS)
          LINUX=$(awk '$2 == "av1converter-x86_64-unknown-linux-musl.tar.gz" {print $1}' dist/SHA256SUMS)
          [ -n "$ARM" ] && [ -n "$INTEL" ] && [ -n "$LINUX" ]
          git clone --depth 1 git@github.com:framicheli/homebrew-tap.git tap
          mkdir -p tap/Formula
          cat > tap/Formula/av1converter.rb <<EOF
          class Av1converter < Formula
            desc "Batch-convert video files to AV1 using FFmpeg"
            homepage "https://github.com/framicheli/av1converter"
            version "$VERSION"
            license "MIT"

            depends_on "ffmpeg"

            on_macos do
              on_arm do
                url "https://github.com/framicheli/av1converter/releases/download/$TAG/av1converter-aarch64-apple-darwin.tar.gz"
                sha256 "$ARM"
              end

              on_intel do
                url "https://github.com/framicheli/av1converter/releases/download/$TAG/av1converter-x86_64-apple-darwin.tar.gz"
                sha256 "$INTEL"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/framicheli/av1converter/releases/download/$TAG/av1converter-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$LINUX"
              end
            end

            def install
              bin.install Dir["av1converter-*"].first => "av1converter"
            end

            test do
              assert_match "av1converter #{version}", shell_output("#{bin}/av1converter --version")
            end
          end
          EOF
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/av1converter.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "av1converter $VERSION"
          git -C tap push

  publish-crate:
    needs: [check-version, release]
    if: >-
      always()
      && needs.check-version.outputs.should_publish == 'true'
      && (needs.release.result == 'success'
        || (needs.release.result == 'skipped' && needs.check-version.outputs.should_release == 'false'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.check-version.outputs.tag }}
      - name: Check crates.io
        id: crate
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -A "av1converter-release ($GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/av1converter/${TAG#v}")
          case "$STATUS" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "${TAG#v} is already on crates.io" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $STATUS"; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: steps.crate.outputs.published == 'false'
        with:
          toolchain: stable
      - name: Publish to crates.io
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
