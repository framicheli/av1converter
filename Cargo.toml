[package]
name = "av1converter"
version = "3.0.0"
edition = "2024"
rust-version = "1.91"
description = "Batch convert video files to AV1 with FFmpeg, from a terminal UI or a daemon with a web UI"
license = "MIT"
repository = "https://github.com/framicheli/av1converter"
readme = "README.md"
keywords = ["av1", "video", "ffmpeg", "encoding", "tui"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ratatui = "0.30.2"
crossterm = "0.29"
toml = "1.1.4"
getrandom = "0.4.3"

# Daemon / web UI
tiny_http = "0.12"
ctrlc = { version = "3.4", features = ["termination"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
